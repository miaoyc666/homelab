server {
    listen 443 ssl;
    server_name git.x.x;

    # 容器内的证书挂载路径
    ssl_certificate /etc/nginx/certs/git.x.x.pem;
    ssl_certificate_key /etc/nginx/certs/git.x.x.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 当客户端用 HTTP 访问此 HTTPS 端口时，nginx 返回 497 错误
    # 捕获 497 并重定向到 https，端口保持不变（$server_port 即宿主机映射的端口）
    error_page 497 https://$host:443$request_uri;

    # 提高大文件（代码库）推送的限制
    client_max_body_size 500M;

    location / {
        # 通过内部 Docker 网络直接将请求转发给 OneDev 容器的 6610 端口
        proxy_pass http://onedev:6610;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 将当前的 13299 端口传递给后端
        proxy_set_header X-Forwarded-Port $server_port;

        # 必须开启 WebSocket 支持，否则 UI 无法实时刷新
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}
